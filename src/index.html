  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style type="text/css">
    .pace .pace-activity {
      top: 19px;
      right: 19px;
      display: none;
    }

    .page-loading {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      right: 0;
      overflow: hidden;
      background: rgb(243 244 246);
      opacity: 1;
      transition: opacity 1s ease-in-out;
      z-index: 1000;
    }

    .loading-icon {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 38px;
      margin-left: -19px;
      margin-top: -19px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: inline-block;
      border-top: 4px solid #FFF;
      border-right: 4px solid transparent;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }

    .spinner::after {
      content: '';
      box-sizing: border-box;
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-bottom: 4px solid #2d71fa;
      border-left: 4px solid transparent;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <div id="page-loading" class="page-loading">
    <span class="spinner loading-icon"></span>
  </div>

  <script>
    (function() {
      function restoreWebSocket() {
        if (typeof window === 'undefined') return;

        // Try to restore from preserved reference
        var nativeWS = window.__NATIVE_WEBSOCKET_PRESERVED__ || window.__NATIVE_WEBSOCKET__;
        if (nativeWS && window.WebSocket !== nativeWS) {
          window.WebSocket = nativeWS;
          console.log('Index.html: Restored native WebSocket');
        }

        // Also try pace.js's stored reference
        if (window._WebSocket && window._WebSocket !== window.WebSocket) {
          window.WebSocket = window._WebSocket;
          console.log('Index.html: Restored native WebSocket from pace.js');
        }

        // Disable pace.js tracking
        if (window.Pace && window.Pace.options) {
          window.Pace.options.ajax = window.Pace.options.ajax || {};
          window.Pace.options.ajax.trackWebSockets = false;
        }
      }

      // Run multiple times to catch pace.js initialization
      restoreWebSocket();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', restoreWebSocket);
      }
      setTimeout(restoreWebSocket, 100);
      setTimeout(restoreWebSocket, 500);
    })();
  </script>
</body>

</html>
