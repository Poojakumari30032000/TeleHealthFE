<div *ngIf="savedUrl && !reSigning" class="sig-pad-saved">
  <div class="sig-pad-preview-shell">
    <img [src]="savedUrl" alt="Saved signature" class="sig-pad-preview-img" />
  </div>
  <div class="sig-pad-saved-actions">
    <button
      nz-button
      nzType="default"
      nzShape="round"
      nzSize="small"
      type="button"
      (click)="startResign()"
    >
      <i class="fa-solid fa-pen"></i> Re-sign
    </button>
    <button
      nz-button
      nzType="default"
      nzShape="round"
      nzSize="small"
      type="button"
      class="sig-pad-remove-btn"
      (click)="removeSignature()"
    >
      <i class="fa-solid fa-trash"></i> Remove
    </button>
  </div>
</div>

<div *ngIf="!savedUrl || reSigning" class="sig-pad-draw-shell" [class.error]="hasError">
  <canvas #sigCanvas class="sig-pad-canvas"></canvas>
  <p class="sig-pad-hint">Draw your signature above</p>
  <div class="sig-pad-actions">
    <button
      nz-button
      nzType="primary"
      nzShape="round"
      nzSize="small"
      type="button"
      (click)="saveSignature()"
      [nzLoading]="uploading"
      [disabled]="uploading"
    >
      <i class="fa-solid fa-cloud-arrow-up"></i> Save Signature
    </button>
    <button
      nz-button
      nzType="default"
      nzShape="round"
      nzSize="small"
      type="button"
      (click)="clear()"
      [disabled]="uploading"
    >
      Clear
    </button>
    <button
      *ngIf="savedUrl && reSigning"
      nz-button
      nzType="default"
      nzShape="round"
      nzSize="small"
      type="button"
      (click)="cancelResign()"
    >
      Cancel
    </button>
  </div>
</div>
