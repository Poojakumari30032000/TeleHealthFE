<div class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 w-full max-w-md">

    <h2 class="text-3xl font-bold mb-4 text-center text-gray-800 dark:text-gray-200">Forgot Password?</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-6 text-center">Enter your email address to reset your password.</p>
    <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email Address</label>
        <input type="email" id="email" name="email" #emailInput="ngModel" [(ngModel)]="emailAddress" required nz-input pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" email class="input-C" placeholder="you@example.com"  [class.border-red-500]="emailInput.touched && emailInput.invalid"
        />
        <div *ngIf="emailInput.touched && emailInput.invalid" class="text-red-500 dark:text-red-400 text-sm mt-1">
          Please enter a valid email address (e.g., user"&#64;"example.com).
        </div>
      </div>
      <button
        type="submit"
        [disabled]="isLoading || forgotForm.invalid"
        class="w-full py-2 rounded-xl bg-primary-600 dark:bg-primary-700 text-white font-semibold transition duration-200 hover:bg-primary-700 dark:hover:bg-primary-600 disabled:bg-gray-400 dark:disabled:bg-gray-600 disabled:cursor-not-allowed"
      >
        <span *ngIf="isLoading" class="inline-block animate-spin h-4 w-4 align-middle border-2 border-white border-t-transparent rounded-full mr-2"></span>
        Send Reset Link
      </button>
      <div *ngIf="errorMessage" class="text-red-500 dark:text-red-400 text-center text-sm mt-2">{{ errorMessage }}</div>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600 dark:text-gray-400">
      Remember your password?
      <a (click)="onLogin()" class="text-primary-600 dark:text-primary-400 hover:underline cursor-pointer">Login</a>
    </p>
  </div>
</div>
