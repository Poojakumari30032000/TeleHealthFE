<div class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="bg-white dark:bg-gray-800 rounded-2xl text-center shadow-lg p-8 w-full max-w-md">
    <h2 class="text-8xl font-bold mb-4 text-center text-gray-800 dark:text-gray-200">404</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-6 text-center">
        Oops! Page not found
    </p>
    <p class="text-gray-600 dark:text-gray-400 mb-6 text-center">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    @if(userRole){
        <a (click)="navigate('role')"
            class="inline-flex bg-primary items-center justify-center px-4 py-1 border border-transparent text-base font-medium rounded-lg text-white hover:bg-primary-700 focus:outline-none transition duration-300 ease-in-out transform shadow-lg">
            <i class="fa-solid fa-house w-5 mr-2"></i>
            <span>Go to Dashboard</span>
        </a>
    }@else {
        <a (click)="navigate('login')"
            class="inline-flex bg-primary items-center justify-center px-4 py-1 border border-transparent text-base font-medium rounded-lg text-white hover:bg-primary-700 focus:outline-none transition duration-300 ease-in-out transform shadow-lg">
            <i class="fas fa-sign-in-alt w-5 mr-2"></i>
            <span>Go to Login Page</span>
        </a>
    }
  </div>
</div>
